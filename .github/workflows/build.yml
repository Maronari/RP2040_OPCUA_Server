name: Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=MinSizeRel

    - name: Build
      run: |
        cd build
        cmake --build . -j$(nproc)

    - name: Check binary size
      run: |
        cd build
        echo "### Binary Size Report" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        find . -name "*.elf" -exec arm-none-eabi-size {} \; >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Verify build outputs
      run: |
        cd build
        UF2_FILES=$(find . -type f -name "*.uf2" -print)
        if [ -z "$UF2_FILES" ]; then
          echo "Error: No .uf2 files generated"
          exit 1
        fi
        echo "$UF2_FILES"
        echo "Build artifacts generated successfully"

    - name: Verify OPC UA event field contract
      run: python3 static/tools/test_opcua_event_field_key_contract.py

    - name: Static analysis (cppcheck)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=warning,style,performance,portability \
          --suppress=missingIncludeSystem \
          --error-exitcode=0 \
          --inline-suppr \
          -I port/open62541 \
          -I libraries/pico-sdk/src \
          port/open62541/*.c 2>&1 | tee cppcheck.log || true
      continue-on-error: true

    - name: Install Renode
      env:
        RENODE_VERSION: 1.15.3
        RENODE_SHA256: 1d313e2bca5d066b4b084c581c933b26a665be45e71b18145c1570490a0e439d
      run: |
        RENODE_ARCHIVE="renode-${RENODE_VERSION}.linux-portable.tar.gz"
        curl --fail --location --retry 3 \
          --output "$RENODE_ARCHIVE" \
          "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/${RENODE_ARCHIVE}"
        echo "${RENODE_SHA256}  ${RENODE_ARCHIVE}" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/renode"
        tar --extract --gzip --file "$RENODE_ARCHIVE" \
          --directory "$RUNNER_TEMP/renode" --strip-components=1
        echo "$RUNNER_TEMP/renode" >> "$GITHUB_PATH"

    - name: Test firmware in emulator
      run: |
        cd build
        ELF_FILE=$(find . -name "*.elf" | head -n 1)
        if [ -z "$ELF_FILE" ]; then
          echo "No ELF file found"
          exit 1
        fi

        cat > test.resc << 'EOF'
        using sysbus
        mach create
        machine LoadPlatformDescription @platforms/cpus/rp2040.repl
        sysbus LoadELF @$ELF_FILE

        logLevel 3

        # Run for 10 seconds
        emulation RunFor "00:00:10"

        # Check if crashed
        cpu IsHalted
        EOF

        timeout 30 renode --disable-xwt --console test.resc || echo "Emulation completed"
      continue-on-error: true

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: firmware
        path: |
          build/**/*.uf2
          build/**/*.elf
          build/**/*.bin
        if-no-files-found: warn

  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Run Semgrep security scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
      continue-on-error: true

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential secrets..."
        if grep -r "password\|secret\|api_key\|token" --include="*.c" --include="*.h" .; then
          echo "Warning: Found potential hardcoded secrets"
        else
          echo "No obvious hardcoded secrets found"
        fi
      continue-on-error: true
