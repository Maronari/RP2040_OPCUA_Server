name: Build Check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_renode:
        description: "Run the non-gating manual Renode experiment"
        required: false
        default: false
        type: boolean

jobs:
  host:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up host-test Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install host-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3
          python3 -m pip install asyncua==2.0.1

      - name: Run host and static verification suites
        run: python3 static/tools/run_host_tests.py

      - name: Verify public OPC UA contract against released v0.5.1
        run: |
          mkdir -p build/reports
          python3 static/tools/verify_opcua_public_contract.py \
            --baseline 2881230c2ccbb98b8701730c4de930dc95da30fc \
            --allow-v052-additions \
            --output build/reports/opcua_public_contract.json

      - name: Prove host-test failures propagate
        run: |
          set +e
          python3 static/tools/run_host_tests.py --inject-failure
          status=$?
          set -e
          if [ "${status}" -ne 1 ]; then
            echo "Expected injected host-test failure exit 1, got ${status}"
            exit 1
          fi

      - name: Validate and render v0.5.2 hardware baseline
        run: |
          python3 static/tools/validate_resource_exhaustion_evidence.py \
            static/benchmarks/v0.5.2/evidence/resource-exhaustion-raw.json \
            --manifest static/benchmarks/v0.5.2/evidence/resource-exhaustion-run.json
          python3 static/tools/validate_v052_opcua_resource_evidence.py \
            static/benchmarks/v0.5.2/evidence/secure-c1-opcua-resources-manifest.json
          python3 static/tools/validate_v052_diag_budget_evidence.py \
            static/benchmarks/v0.5.2/evidence/secure-c1-diag-budget-manifest.json
          python3 static/tools/validate_benchmark_baseline.py \
            --baseline static/benchmarks/v0.5.2/baseline.json \
            --thresholds static/benchmarks/v0.5.2/thresholds.json \
            --static-report static/benchmarks/v0.5.2/evidence/secure-c1-static-size.json
          python3 static/tools/render_benchmark_baseline.py \
            --baseline static/benchmarks/v0.5.2/baseline.json \
            --thresholds static/benchmarks/v0.5.2/thresholds.json \
            --output build/reports/v0.5.2-baseline.md
          cmp docs/releases/v0.5.2-baseline.md build/reports/v0.5.2-baseline.md

      - name: Enforce v0.5.2 release hardware evidence
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 static/tools/validate_benchmark_baseline.py \
            --baseline static/benchmarks/v0.5.2/baseline.json \
            --thresholds static/benchmarks/v0.5.2/thresholds.json \
            --static-report static/benchmarks/v0.5.2/evidence/secure-c1-static-size.json \
            --require-release-ready

      - name: Upload host contract evidence
        uses: actions/upload-artifact@v7
        with:
          name: host-contract-evidence
          path: |
            build/reports/opcua_public_contract.json
            build/reports/v0.5.2-baseline.md
            static/benchmarks/v0.5.2/baseline.json
            static/benchmarks/v0.5.2/thresholds.json
            static/benchmarks/v0.5.2/evidence/*.json
            static/benchmarks/v0.5.2/evidence/*.log
          if-no-files-found: error

  firmware:
    name: firmware (${{ matrix.driver_pack }})
    runs-on: ubuntu-latest
    # Both firmware profiles are configured, built and linked on every run:
    # ROADMAP.md's v0.5.1 acceptance requires at least two profiles with the
    # disabled drivers' symbols absent from the smaller ELF, and "base" is
    # the reference-board Debug build. fail-fast is off so one profile's
    # failure never hides the other's result.
    strategy:
      fail-fast: false
      matrix:
        driver_pack: [base, industrial]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install firmware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3

      - name: Configure ${{ matrix.driver_pack }}-pack Debug build
        run: |
          # FIRMWARE_DRIVER_PACK is always passed explicitly, never left to
          # the CMake default. PICO_BOARD and the W5500 pins are not passed:
          # they follow the pack (base -> waveshare_core2350b_16mb_psram8mb,
          # industrial -> rp2350_industrial_mvp_v1 with W5500 on GPIO4..8),
          # and a contradicting -DPICO_BOARD is a configure error.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWIZNET_CHIP=W5500 \
            -DFIRMWARE_DRIVER_PACK=${{ matrix.driver_pack }} \
            -DOTA_ROM_PRIMARY_APP=ON \
            -DOTA_BUILD_BOOTLOADER=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Verify ${{ matrix.driver_pack }} board profile
        run: |
          python3 static/tools/check_board_profile.py --build-dir build

      - name: Build ${{ matrix.driver_pack }} firmware target
        run: |
          cmake --build build --target all

      - name: Verify linked driver set
        run: |
          python3 static/tools/check_driver_pack_symbols.py \
            --driver-pack ${{ matrix.driver_pack }} \
            --elf build/app/basic_profile/device_profile_basic.elf | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate size reports
        run: |
          mkdir -p build/reports
          arm-none-eabi-size build/app/basic_profile/device_profile_basic.elf | tee build/reports/size.txt
          arm-none-eabi-size -A build/app/basic_profile/device_profile_basic.elf | tee build/reports/sections.txt
          python3 static/tools/generate_static_size_report.py \
            --elf build/app/basic_profile/device_profile_basic.elf \
            --uf2 build/app/basic_profile/device_profile_basic.uf2 \
            --bin build/app/basic_profile/device_profile_basic.bin \
            --map build/app/basic_profile/device_profile_basic.elf.map \
            --cmake-cache build/CMakeCache.txt \
            --output build/reports/static_size_report.json
          python3 static/tools/validate_benchmark_baseline.py \
            --baseline static/benchmarks/v0.5.2/baseline.json \
            --thresholds static/benchmarks/v0.5.2/thresholds.json \
            --static-report build/reports/static_size_report.json

      - name: Label industrial driver hardware-qualification status
        if: matrix.driver_pack == 'industrial'
        run: |
          python3 static/tools/label_driver_qualification_status.py \
            --driver-pack industrial \
            --report docs/releases/v0.5.1-driver-verification.md \
            --output build/reports/driver_qualification_status.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify version integrity
        env:
          EXPECTED_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python3 static/tools/verify_version_integrity.py \
            --build-dir build \
            --expected-tag "${EXPECTED_TAG}" \
            --output build/reports/version_integrity.json

      - name: Prove artifact checker fails on empty build directory
        run: |
          empty_dir="$(mktemp -d)"
          if python3 static/tools/check_build_artifacts.py --build-dir "${empty_dir}"; then
            echo "Expected artifact checker to fail for an empty directory"
            exit 1
          fi

      - name: Prove artifact checker rejects empty files
        run: |
          invalid_dir="$(mktemp -d)"
          python3 - "${invalid_dir}" <<'PY'
          import pathlib
          import sys
          from static.tools.check_build_artifacts import REQUIRED_RELATIVE_PATHS

          root = pathlib.Path(sys.argv[1])
          for relative in REQUIRED_RELATIVE_PATHS:
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.touch()
          PY
          if python3 static/tools/check_build_artifacts.py --build-dir "${invalid_dir}"; then
            echo "Expected artifact checker to reject empty artifact files"
            exit 1
          fi

      - name: Verify required build artifacts
        run: |
          python3 static/tools/check_build_artifacts.py \
            --build-dir build \
            --output build/reports/artifact_check.json

      - name: Upload firmware and release evidence
        uses: actions/upload-artifact@v7
        with:
          name: firmware-debug-${{ matrix.driver_pack }}
          path: |
            build/app/basic_profile/device_profile_basic.elf
            build/app/basic_profile/device_profile_basic.uf2
            build/app/basic_profile/device_profile_basic.bin
            build/app/basic_profile/device_profile_basic.elf.map
            build/config_export.json
            build/generated/ota_layout/ota_layout.json
            build/reports/size.txt
            build/reports/sections.txt
            build/reports/static_size_report.json
            build/reports/version_integrity.json
            build/reports/artifact_check.json
            build/reports/driver_qualification_status.json
            build/CMakeCache.txt
            build/compile_commands.json
          # driver_qualification_status.json exists only for industrial; a
          # missing path among others is skipped, and "error" still fails an
          # upload that finds nothing at all.
          if-no-files-found: error

  benchmark_firmware:
    name: benchmark firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: secure-c1
            profile_id: v052-syn-c1-ns0full-secbasic256sha256-signandencrypt-cl1-hz1-ev0-hist0
            channels: 1
            rate_hz: 1
            clients: 1
            security: basic256sha256-signandencrypt
            events: OFF
            history: OFF
          - name: test-none-c16
            profile_id: v052-syn-c16-ns0full-sectest-none-cl4-hz10-ev1-hist1
            channels: 16
            rate_hz: 10
            clients: 4
            security: test-none
            events: ON
            history: ON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install firmware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3

      - name: Configure ${{ matrix.name }} benchmark image
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWIZNET_CHIP=W5500 \
            -DFIRMWARE_DRIVER_PACK=base \
            -DOTA_ROM_PRIMARY_APP=ON \
            -DOTA_BUILD_BOOTLOADER=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFIRMWARE_BENCHMARK_PROFILE=synthetic \
            -DFIRMWARE_BENCHMARK_CHANNELS=${{ matrix.channels }} \
            -DFIRMWARE_BENCHMARK_RATE_HZ=${{ matrix.rate_hz }} \
            -DFIRMWARE_BENCHMARK_CLIENTS=${{ matrix.clients }} \
            -DFIRMWARE_BENCHMARK_SECURITY=${{ matrix.security }} \
            -DFIRMWARE_BENCHMARK_EVENTS=${{ matrix.events }} \
            -DFIRMWARE_BENCHMARK_HISTORY=${{ matrix.history }}

      - name: Build ${{ matrix.name }} benchmark image
        run: cmake --build build --target all

      - name: Verify benchmark profile and static size
        run: |
          mkdir -p build/reports
          python3 static/tools/check_board_profile.py --build-dir build
          python3 static/tools/benchmark_profiles.py \
            --profile-id ${{ matrix.profile_id }} \
            --verify-export build/config_export.json \
            --verify-metadata build/benchmark_profile.json \
            --output build/reports/profile-verification.json
          python3 static/tools/generate_static_size_report.py \
            --elf build/app/basic_profile/device_profile_basic.elf \
            --uf2 build/app/basic_profile/device_profile_basic.uf2 \
            --bin build/app/basic_profile/device_profile_basic.bin \
            --map build/app/basic_profile/device_profile_basic.elf.map \
            --cmake-cache build/CMakeCache.txt \
            --output build/reports/static_size_report.json
          python3 static/tools/validate_benchmark_baseline.py \
            --baseline static/benchmarks/v0.5.2/baseline.json \
            --thresholds static/benchmarks/v0.5.2/thresholds.json \
            --static-report build/reports/static_size_report.json

      - name: Upload benchmark firmware evidence
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-firmware-${{ matrix.name }}
          path: |
            build/app/basic_profile/device_profile_basic.elf
            build/app/basic_profile/device_profile_basic.uf2
            build/app/basic_profile/device_profile_basic.bin
            build/app/basic_profile/device_profile_basic.elf.map
            build/config_export.json
            build/benchmark_profile.json
            build/reports/profile-verification.json
            build/reports/static_size_report.json
            build/CMakeCache.txt
            build/compile_commands.json
          if-no-files-found: error

  resource_exhaustion_firmware:
    name: resource exhaustion test firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install firmware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi cppcheck python3

      - name: Configure test-only reference image
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPICO_BOARD=waveshare_core2350b_16mb_psram8mb \
            -DWIZNET_CHIP=W5500 \
            -DFIRMWARE_DRIVER_PACK=base \
            -DOTA_ROM_PRIMARY_APP=ON \
            -DOTA_BUILD_BOOTLOADER=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFIRMWARE_BENCHMARK_PROFILE=resource-exhaustion

      - name: Build test-only reference image
        run: cmake --build build --target all

      - name: Run blocking first-party cppcheck for exhaustion profile
        run: |
          mkdir -p build/reports
          python3 static/tools/run_first_party_cppcheck.py \
            --build-dir build \
            --xml-output build/reports/cppcheck-resource-exhaustion.xml \
            --text-output build/reports/cppcheck-resource-exhaustion.txt

      - name: Verify profile metadata and static size
        run: |
          mkdir -p build/reports
          python3 static/tools/check_board_profile.py --build-dir build
          python3 - <<'PY'
          import json
          import pathlib

          metadata = json.loads(pathlib.Path("build/resource_exhaustion_profile.json").read_text())
          expected = {
              "schemaVersion": 1,
              "profileId": "v052-resource-exhaustion-reference",
              "board": "waveshare_core2350b_16mb_psram8mb",
              "driverPack": "base",
              "testOnly": True,
              "persistentWritesAllowed": False,
              "cyclesPerAllocator": 100,
              "pointerCapacity": 512,
              "heapRequestBytes": 1024,
              "psramRequestBytes": 16384,
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"resource exhaustion metadata mismatch: {key}")
          PY
          python3 static/tools/generate_static_size_report.py \
            --elf build/app/basic_profile/device_profile_basic.elf \
            --uf2 build/app/basic_profile/device_profile_basic.uf2 \
            --bin build/app/basic_profile/device_profile_basic.bin \
            --map build/app/basic_profile/device_profile_basic.elf.map \
            --cmake-cache build/CMakeCache.txt \
            --output build/reports/static_size_report.json
          python3 static/tools/validate_benchmark_baseline.py \
            --baseline static/benchmarks/v0.5.2/baseline.json \
            --thresholds static/benchmarks/v0.5.2/thresholds.json \
            --static-report build/reports/static_size_report.json

      - name: Upload exhaustion-test firmware evidence
        uses: actions/upload-artifact@v7
        with:
          name: resource-exhaustion-firmware
          path: |
            build/app/basic_profile/device_profile_basic.elf
            build/app/basic_profile/device_profile_basic.uf2
            build/app/basic_profile/device_profile_basic.bin
            build/app/basic_profile/device_profile_basic.elf.map
            build/resource_exhaustion_profile.json
            build/reports/static_size_report.json
            build/reports/cppcheck-resource-exhaustion.xml
            build/reports/cppcheck-resource-exhaustion.txt
            build/CMakeCache.txt
            build/compile_commands.json
          if-no-files-found: error

  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi cppcheck python3

      - name: Configure both board profiles
        run: |
          # cppcheck analyses what compile_commands.json lists, and each pack
          # compiles a different set of translation units: industrial-only
          # drivers exist only in the industrial build, base-only fallbacks
          # only in the base build. Both are configured and both are gated.
          for pack in base industrial; do
            cmake -S . -B "build-${pack}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWIZNET_CHIP=W5500 \
              -DFIRMWARE_DRIVER_PACK="${pack}" \
              -DOTA_ROM_PRIMARY_APP=ON \
              -DOTA_BUILD_BOOTLOADER=OFF \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            python3 static/tools/check_board_profile.py --build-dir "build-${pack}"
          done

      - name: Run blocking first-party cppcheck (base profile)
        run: |
          python3 static/tools/run_first_party_cppcheck.py \
            --build-dir build-base \
            --xml-output build-reports/cppcheck-base.xml \
            --text-output build-reports/cppcheck-base.txt

      - name: Run blocking first-party cppcheck (industrial profile)
        run: |
          python3 static/tools/run_first_party_cppcheck.py \
            --build-dir build-industrial \
            --xml-output build-reports/cppcheck-industrial.xml \
            --text-output build-reports/cppcheck-industrial.txt

      - name: Upload analysis logs
        uses: actions/upload-artifact@v7
        with:
          name: analysis
          path: |
            build-reports/cppcheck-base.xml
            build-reports/cppcheck-base.txt
            build-reports/cppcheck-industrial.xml
            build-reports/cppcheck-industrial.txt
          if-no-files-found: error

  renode_experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_renode }}
    runs-on: ubuntu-latest
    needs:
      - host
      - firmware
      - analysis

    steps:
      - name: Declare manual-only experiment status
        run: |
          echo "Renode remains a manual experiment because this workflow does not have an asserted RP2350 target model for waveshare_core2350b_16mb_psram8mb."
          echo "No RP2040 platform substitution is used in release gating."
